# ---------------------------------------------------------------------------
#  Build settings
#  Only plugins on the GitHub Pages allow-list are used, so the site builds
#  natively on GitHub Pages with no Actions workflow required.
# ---------------------------------------------------------------------------
markdown:         kramdown
highlighter:      rouge
permalink:        /:categories/:title/
timezone:         Asia/Dhaka

kramdown:
  input:          GFM
  auto_ids:       true
  smart_quotes:   lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  publications:
    output:       false

defaults:
  - scope:
      path:       ""
      type:       "pages"
    values:
      layout:     "page"

sass:
  style:          compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - GUIDE.md
  - deploy.bat
  - deploy.sh
  - .sass-cache
