<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-name">&copy; {{ site.time | date: "%Y" }} {{ site.name }}</p>
    <p class="footer-meta">{{ site.affiliation }} · {{ site.location }}</p>
    <ul class="footer-links">
      {% for item in site.data.navigation %}
      <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
    <p class="footer-colophon">Built with Jekyll and hosted on GitHub Pages. Last updated {{ site.time | date: "%d %B %Y" }}.</p>
  </div>
</footer>
