<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.name }} · {{ site.affiliation }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="{{ site.name }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.name }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/profile.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <!-- Set the colour scheme before first paint so the page never flashes. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      } catch (e) { /* private mode — fall back to the light default */ }
    })();
  </script>

  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/inter-latin-wght-normal.woff2' | relative_url }}">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/newsreader-latin-wght-normal.woff2' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
